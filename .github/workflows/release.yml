on:
  push:
    tags:
      - 'v*'
name: Release

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Validate composer.json for Packagist
        run: composer validate --strict

      - name: Install composer dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Check the tag matches the SDK version
        run: php .github/scripts/check-release-version.php "${GITHUB_REF_NAME}"

      - name: Run unit tests
        run: vendor/bin/phpunit

      # Packagist publishes the new tag through its GitHub webhook; this only records the GitHub release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes $prerelease
