on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 */3 * *'
name: CI

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        php:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "nightly"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          ini-values: assert.exception=1, zend.assertions=1

      - name: Validate composer.json for Packagist
        run: composer validate --strict

      - name: Install composer dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit --coverage-text

      - name: Dump an authoritative classmap
        run: composer dump-autoload --classmap-authoritative --no-interaction

      - name: Check legacy class name with an authoritative classmap
        run: php .github/scripts/legacy-alias-smoke.php
